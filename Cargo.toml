[package]
name = "rsbuild"
version = "0.5.1"
edition = "2021"
license = "MIT"
description = "A self-sufficient runtime to build projects"
repository = "https://github.com/JeanMaximilienCadic/rsbuild"
keywords = ["build", "docker", "wheel", "cython", "automation"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "rsbuild"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
thiserror = "1"
anyhow = { version = "1", features = ["backtrace"] }
which = "7"
notify = "7"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
ctrlc = "3"

[profile.release]
opt-level = 3
lto = true
