name: Publish to crates.io

on:
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check and bump version if needed
        id: version
        run: |
          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version in Cargo.toml: $CURRENT_VERSION"

          # Get latest version from crates.io
          CRATES_RESPONSE=$(curl -s "https://crates.io/api/v1/crates/rsbuild" || echo '{}')
          LATEST_CRATES_VERSION=$(echo "$CRATES_RESPONSE" | grep -o '"newest_version":"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"/\1/' || echo "0.0.0")
          echo "Latest version on crates.io: $LATEST_CRATES_VERSION"

          # Function to compare semver versions
          version_gt() {
            test "$(printf '%s\n' "$@" | sort -V | head -n 1)" != "$1"
          }

          # If current version exists on crates.io, bump it
          if curl -s "https://crates.io/api/v1/crates/rsbuild/$CURRENT_VERSION" | grep -q '"version"'; then
            echo "Version $CURRENT_VERSION already exists on crates.io, bumping..."

            # Parse and bump patch version
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

            # Check if new version also exists, keep bumping if needed
            while curl -s "https://crates.io/api/v1/crates/rsbuild/$NEW_VERSION" | grep -q '"version"'; do
              echo "Version $NEW_VERSION also exists, bumping again..."
              NEW_PATCH=$((NEW_PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
            done

            echo "New version will be: $NEW_VERSION"

            # Update Cargo.toml
            sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml

            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION does not exist on crates.io, using it"
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add Cargo.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Verify build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_TOKEN }}

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
