name: Publish to crates.io

on:
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check and bump version if needed
        id: version
        run: |
          set -e

          # Get current version from Cargo.toml
          CURRENT_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version in Cargo.toml: $CURRENT_VERSION"

          # Use cargo search to check if version exists (more reliable than crates.io API)
          # Disable colors to get clean output
          SEARCH_RESULT=$(CARGO_TERM_COLOR=never cargo search rsbuild --limit 1 2>/dev/null || echo "")
          echo "Cargo search result: $SEARCH_RESULT"

          # Strip any ANSI codes and extract version from search result (format: rsbuild = "0.2.0")
          CLEAN_RESULT=$(echo "$SEARCH_RESULT" | sed 's/\x1b\[[0-9;]*m//g')
          CRATES_VERSION=$(echo "$CLEAN_RESULT" | grep -oP 'rsbuild = "\K[^"]+' || echo "")
          echo "Latest version on crates.io: ${CRATES_VERSION:-not found}"

          # Function to check if current version is less than or equal to crates version
          version_lte() {
            [ "$1" = "$(echo -e "$1\n$2" | sort -V | head -n1)" ]
          }

          NEED_BUMP=false

          # If crates version exists and current version is <= crates version, we need to bump
          if [ -n "$CRATES_VERSION" ]; then
            if version_lte "$CURRENT_VERSION" "$CRATES_VERSION"; then
              echo "Current version $CURRENT_VERSION is <= crates.io version $CRATES_VERSION, bumping..."
              NEED_BUMP=true
            fi
          fi

          if [ "$NEED_BUMP" = "true" ]; then
            # Start from crates version and bump patch
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CRATES_VERSION"
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

            echo "New version will be: $NEW_VERSION"

            # Update Cargo.toml
            sed -i "s/^version = \"$CURRENT_VERSION\"/version = \"$NEW_VERSION\"/" Cargo.toml

            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "bumped=true" >> $GITHUB_OUTPUT
          else
            echo "Version $CURRENT_VERSION is new, using it"
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add Cargo.toml
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Verify build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish --allow-dirty

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
